spring:
  profiles:
    active: dev

  application:
    name: SlothNote

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/slothnote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:TODO_DB_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

# AI provider config is stored in the database table `system_ai_config`.
# Edit it from Admin / System Settings after applying the SQL migration.
# Mail SMTP config is stored in the database table `system_mail_config`.
# Edit it from Admin / System Settings after applying the SQL migration.

server:
  port: ${SERVER_PORT:8080}

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false

storage:
  local:
    root-dir: "${STORAGE_LOCAL_ROOT_DIR:./file}"
    public-base-url: "${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}"
    enable-date-path: true
    keep-extension: true
