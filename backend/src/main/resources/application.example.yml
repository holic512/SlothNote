spring:
  profiles:
    active: dev

  application:
    name: SlothNote

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/sqlite/schema.sql
      data-locations: classpath:sql/sqlite/data.sql,classpath:sql/sqlite/migrate-legacy-timestamps.sql
      separator: "@@"

# AI provider config is stored in the database table `system_ai_config`.
# Edit it from Admin / System Settings after applying the SQL migration.
# Mail SMTP config is stored in the database table `system_mail_config`.
# Edit it from Admin / System Settings after applying the SQL migration.

server:
  port: ${SERVER_PORT:8080}

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false

storage:
  local:
    root-dir: "${STORAGE_LOCAL_ROOT_DIR:./file}"
    public-base-url: "${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}"
    enable-date-path: true
    keep-extension: true
  sqlite:
    # Defaults to <storage.local.root-dir>/base/slothnote.db when unset.
    path: "${SQLITE_DB_PATH:}"
    busy-timeout-ms: ${SQLITE_BUSY_TIMEOUT_MS:5000}
    maximum-pool-size: ${SQLITE_MAXIMUM_POOL_SIZE:4}
